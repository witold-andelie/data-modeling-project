name: customer360-course
services:
  mysql:
    image: mysql:8.4
    mem_limit: 512m
    mem_reservation: 256m
    memswap_limit: 512m
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=20
      - --performance-schema=OFF
      - --table-open-cache=400
      - --thread-cache-size=4
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --temptable-max-ram=32M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer360}
      MYSQL_USER: ${MYSQL_USER:-customer360}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Create .env from .env.example}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Create .env from .env.example}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_memory_transaction_total_max: 96m
      NEO4J_db_memory_transaction_max: 64m
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
  neo4j_data:
