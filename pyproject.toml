[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer360-course"
version = "0.1.0"
description = "Relational and graph database course project with external analytics contracts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
databases = ["mysql-connector-python>=9,<10", "neo4j>=5.26,<6"]

[project.scripts]
c360 = "c360.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
